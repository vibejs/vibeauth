name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibeauth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vibeauth
      # Temporary: @usevibejs/form and @usevibejs/query are not on npm yet. scripts/bootstrap.ts packs
      # these pinned commits into .local-packs, and the lockfile pins those tarballs by integrity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vibejs/vibeform
          ref: 27f8d12bb1f83b510413d5a87055e7ab8ebedc90
          path: vibeform
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vibejs/vibequery
          ref: 8ccbee9841c9d76e2fc57e2a4d4d570da4e5ceec
          path: vibequery
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          working-directory: vibeauth
          install: false
      - name: Build unpublished optional ecosystem adapters
        run: |
          pnpm --config.manage-package-manager-versions=false --dir ../vibeform install --frozen-lockfile
          pnpm --config.manage-package-manager-versions=false --dir ../vibeform build
          pnpm --config.manage-package-manager-versions=false --dir ../vibequery install --frozen-lockfile
          pnpm --config.manage-package-manager-versions=false --dir ../vibequery build
          node scripts/bootstrap.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm audit --prod
      - run: git diff --exit-code
